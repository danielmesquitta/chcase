[package]
name = "chcase"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Change text between camelCase, snake_case, kebab-case and other cases"
license = "MIT"
repository = "https://github.com/danielmesquitta/chcase"
readme = "README.md"
keywords = ["case", "convert", "camelcase", "snakecase", "cli"]
categories = ["command-line-utilities", "text-processing"]

[lints.rust]
unsafe_code = "forbid"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
clap_complete = "4.6.12"
heck = "0.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rstest = "0.29.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
